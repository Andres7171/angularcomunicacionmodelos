<h1>Hijo Coche</h1>
<h2 style="color: blue">{{ car.marca }} {{ car.modelo }}</h2>
<h3
  [ngClass]="{
    rojo: car.velocidad == 0,
    verde: car.velocidad > 0,
  }"
>
  velocidad actual: {{ car.velocidad }}
</h3>
<button (click)="acelerarCoche()">Acelerar</button>
<button (click)="frenarCoche()">Frenar</button>
